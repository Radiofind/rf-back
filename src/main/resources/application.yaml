spring:
  application:
    name: monolit

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 115MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.frontend-url},http://localhost:4200}

  storage:
    avatar-path: ${AVATARS_PATH:./storage/avatars}
    track-audio-path: ${TRACK_AUDIO_PATH:./storage/tracks/audio}
    track-cover-path: ${TRACK_COVERS_PATH:./storage/tracks/covers}

  fingerprint:
    fpcalc-path: ${FPCALC_PATH:fpcalc}
    timeout: 30s
    duplicate-similarity: 0.85
    possible-duplicate-similarity: 0.70
    duration-tolerance-seconds: 15
    max-offset: 80
    min-overlap: 40

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
